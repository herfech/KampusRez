{% load static %}
{# TR: KampüsRez logosu (simge + yazı). Kullanım: {% include "partials/logo.html" with variant="white" size="lg" %} #}
{# ES: Logo de KampüsRez (símbolo + texto). Uso: {% include "partials/logo.html" with variant="white" size="lg" %} #}

    <span class="kr-logo-word">kampüs<span class="kr-logo-accent">rez</span></span>
</span>

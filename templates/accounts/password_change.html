{% extends "base.html" %}

{% block title %}Parolamı Değiştir · KampüsRez{% endblock %}

{% block content %}
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'accounts:profile' %}">Profilim</a></li>
            <li class="breadcrumb-item active" aria-current="page">Parolamı Değiştir</li>
        </ol>
    </nav>
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="icon-tile mb-3"><i class="bi bi-key"></i></span>
            <h1 class="h3 fw-bold">Parolamı Değiştir</h1>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "partials/form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2">Parolayı Değiştir</button>
        </form>
    </div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Parolamı Unuttum · KampüsRez{% endblock %}

{% block content %}
    <div class="card auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="icon-tile mb-3"><i class="bi bi-envelope"></i></span>
            <h1 class="h3 fw-bold">Parolamı Unuttum</h1>
            <p class="text-secondary mb-0">Kayıtlı e-posta adresinizi girin; parola sıfırlama bağlantısını gönderelim.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include "partials/form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2">Bağlantı Gönder</button>
        </form>
        <p class="text-center text-secondary mt-4 mb-0"><a href="{% url 'accounts:login' %}">Giriş sayfasına dön</a></p>
    </div>
{% endblock %}

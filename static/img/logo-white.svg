<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 140" role="img" aria-label="KampüsRez">
  <!-- TR: Beyaz sürüm (koyu zeminler). KampüsRez simgesi: 7 modülden oluşan "ü" — beyaz nokta boş alan, kırmızı nokta rezervasyon -->
  <!-- ES: Versión blanca (fondos oscuros). Símbolo de KampüsRez: "ü" formada por 7 módulos — punto blanco espacio libre, punto rojo reserva -->
  <circle cx="14" cy="14" r="13" fill="#ffffff"/>
  <circle cx="84" cy="14" r="13" fill="#c8102e"/>
  <rect x="0" y="42" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="70" y="42" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="0" y="77" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="70" y="77" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="0" y="112" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="35" y="112" width="28" height="28" rx="7" fill="#ffffff"/>
  <rect x="70" y="112" width="28" height="28" rx="7" fill="#ffffff"/>
</svg>
